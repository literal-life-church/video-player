<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Literal Life Church Video Player</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

        <style>
            * {
                font-family: "Roboto", sans-serif;
            }

            /* Some example ways you can stylize the video player container and its contents */

            #literal-life-church-video-player {
                align-items: center;
                background: #000;
                color: #ffffff;
                display: flex;
                justify-content: center;
                max-width: 960px;
                width: 50%;
            }

            #literal-life-church-video-player h1 {
                color: #da7e73;
            }

            #literal-life-church-video-player a {
                color: #5dade2;
            }

            #literal-life-church-video-player .event-canceled-status-balloon {
                background-color: #c0392b !important;
                color: #ffffff;
            }

            #literal-life-church-video-player .event-canceled-original-schedule .event-canceled-original-schedule-label {
                font-style: italic;
            }

            #literal-life-church-video-player .event-canceled-original-schedule .event-canceled-original-schedule-time {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div
            id="literal-life-church-video-player"
            data-aspect-ratio="16 / 9"
            data-backend-host="api.example.com"
            data-offline-message="# Event Offline
Please come back later."
            data-prewarming-message="# Event Going Live Soon
Please stay tuned."></div>

        <script src="player.js"></script>
    </body>
</html>
